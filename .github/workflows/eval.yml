name: Evaluate

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        default: claude-opus-5-5
      effort:
        description: Reasoning effort
        default: low

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_MODEL: ${{ inputs.model }}
      LLM_EFFORT: ${{ inputs.effort }}
      REFERENCE_DATETIME: "2026-03-25T10:00:00"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m evals.runner --output-dir eval-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results/
