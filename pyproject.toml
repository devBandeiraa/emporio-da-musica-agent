[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporio-agent"
version = "1.0.0"
description = "Customer support agent for Empório da Música, a fictional musical instrument store."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34,<3",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["emporio_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
